<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">Abstract angular galaxy survey visualisation</title>
  <desc id="desc">A dark panoramic field with survey cones, coloured density maps, stars, and angular grid lines.</desc>
  <defs>
    <linearGradient id="space" x1="0" x2="1">
      <stop offset="0" stop-color="#03080d"/>
      <stop offset="0.5" stop-color="#0b1821"/>
      <stop offset="1" stop-color="#04070b"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" x2="1">
      <stop offset="0" stop-color="#183343" stop-opacity="0.35"/>
      <stop offset="0.42" stop-color="#5ba5be" stop-opacity="0.38"/>
      <stop offset="0.78" stop-color="#a2d9e0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d5f6ef" stop-opacity="0.07"/>
    </linearGradient>
    <radialGradient id="disc">
      <stop offset="0" stop-color="#ffe365"/>
      <stop offset="0.31" stop-color="#e85062"/>
      <stop offset="0.61" stop-color="#763ca7"/>
      <stop offset="1" stop-color="#0f2b5e"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#e7faff" stop-opacity="0.9"/>
      <stop offset="0.14" stop-color="#8ed1e6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3088ac" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.6"/></filter>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#9ed7df" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="440" fill="url(#space)"/>
  <g opacity="0.9">
    <circle cx="80" cy="72" r="1.8" fill="#fff"/><circle cx="164" cy="328" r="1.2" fill="#9fe5ff"/>
    <circle cx="272" cy="92" r="1.5" fill="#fff"/><circle cx="368" cy="370" r="1.4" fill="#fff"/>
    <circle cx="490" cy="48" r="1.5" fill="#a9e6ff"/><circle cx="620" cy="112" r="1.1" fill="#fff"/>
    <circle cx="748" cy="385" r="1.6" fill="#fff"/><circle cx="876" cy="76" r="1.4" fill="#e3f8ff"/>
    <circle cx="1002" cy="346" r="1.2" fill="#fff"/><circle cx="1134" cy="62" r="1.5" fill="#a9e6ff"/>
    <circle cx="1240" cy="388" r="1.8" fill="#fff"/><circle cx="1365" cy="118" r="1.3" fill="#fff"/>
    <circle cx="1518" cy="332" r="1.5" fill="#9fe5ff"/>
  </g>
  <ellipse cx="154" cy="270" rx="182" ry="170" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="176" cy="265" r="70" fill="url(#disc)"/>
  <circle cx="176" cy="265" r="73" fill="none" stroke="#c7eef0" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M178 198C500 115 914 65 1440 28L1440 412C924 374 508 327 178 332Z" fill="url(#cone)" stroke="#d3f3f4" stroke-opacity="0.38" stroke-width="2"/>
  <path d="M194 211C516 148 923 113 1394 88M194 318C518 352 923 368 1394 378" fill="none" stroke="#d5f0f1" stroke-opacity="0.19"/>
  <g fill="none" stroke="#a4d7de" stroke-opacity="0.23">
    <ellipse cx="324" cy="265" rx="25" ry="78"/><ellipse cx="438" cy="264" rx="32" ry="96"/>
    <ellipse cx="570" cy="263" rx="39" ry="113"/><ellipse cx="720" cy="257" rx="47" ry="133"/>
    <ellipse cx="892" cy="249" rx="54" ry="155"/><ellipse cx="1084" cy="237" rx="63" ry="178"/>
    <ellipse cx="1298" cy="222" rx="73" ry="204"/>
  </g>
  <path d="M225 204L1390 76V386L225 325Z" fill="url(#grid)" opacity="0.55"/>
  <g fill="#d7f9ff" filter="url(#soft)">
    <circle cx="302" cy="272" r="3"/><circle cx="334" cy="235" r="2"/><circle cx="370" cy="301" r="2.8"/>
    <circle cx="415" cy="220" r="3.2"/><circle cx="443" cy="287" r="2"/><circle cx="484" cy="250" r="4"/>
    <circle cx="523" cy="317" r="2.6"/><circle cx="566" cy="191" r="2"/><circle cx="601" cy="274" r="4.4"/>
    <circle cx="647" cy="231" r="2.8"/><circle cx="689" cy="338" r="3.1"/><circle cx="733" cy="178" r="3"/>
    <circle cx="772" cy="288" r="4"/><circle cx="821" cy="224" r="2.6"/><circle cx="860" cy="321" r="3.3"/>
    <circle cx="913" cy="162" r="2.8"/><circle cx="950" cy="259" r="4.4"/><circle cx="997" cy="342" r="2.5"/>
    <circle cx="1032" cy="198" r="3.8"/><circle cx="1086" cy="286" r="2.8"/><circle cx="1128" cy="128" r="3"/>
    <circle cx="1174" cy="235" r="4.6"/><circle cx="1226" cy="336" r="3"/><circle cx="1270" cy="170" r="4"/>
    <circle cx="1322" cy="275" r="3.4"/><circle cx="1370" cy="110" r="3"/>
  </g>
  <g fill="#52b8d1" fill-opacity="0.4">
    <circle cx="410" cy="264" r="15"/><circle cx="604" cy="242" r="22"/><circle cx="745" cy="300" r="14"/>
    <circle cx="906" cy="218" r="26"/><circle cx="1102" cy="274" r="18"/><circle cx="1260" cy="228" r="29"/>
  </g>
  <g opacity="0.72">
    <rect x="1398" y="35" width="158" height="158" fill="#14233d" stroke="#d9f1f0" stroke-opacity="0.7"/>
    <circle cx="1477" cy="114" r="64" fill="url(#disc)"/>
    <path d="M1415 111C1440 74 1460 142 1487 92S1532 100 1541 76" fill="none" stroke="#ffbd5a" stroke-opacity="0.6" stroke-width="4"/>
    <rect x="1398" y="213" width="158" height="158" fill="#30204d" stroke="#d9f1f0" stroke-opacity="0.7"/>
    <path d="M1398 319C1433 235 1483 374 1556 253V371H1398Z" fill="#e55e42" fill-opacity="0.55"/>
    <path d="M1398 245C1455 344 1502 214 1556 305" fill="none" stroke="#58d1d1" stroke-width="24" stroke-opacity="0.38"/>
    <g fill="#eefcff"><circle cx="1430" cy="288" r="2"/><circle cx="1452" cy="260" r="2"/><circle cx="1489" cy="311" r="2"/><circle cx="1521" cy="274" r="2"/></g>
  </g>
  <g fill="#d9e7ea" font-family="Arial, Helvetica, sans-serif" font-size="16" opacity="0.72">
    <text x="66" y="52">early structure</text><text x="358" y="58">angular modes</text>
    <text x="716" y="57">growth of structure</text><text x="1118" y="56">galaxy surveys</text>
  </g>
</svg>
